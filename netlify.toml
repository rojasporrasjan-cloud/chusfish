# ════════════════════════════════════════════════════
#  Chus's Fish — Netlify config
# ════════════════════════════════════════════════════

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true

[build.processing.html]
  pretty_urls = true

# ── Security headers ────────────────────────────────
#  Ojo: el login con Google necesita el authDomain (chus-fish.firebaseapp.com)
#  en frame-src Y TAMBIEN en connect-src. Con solo frame-src el iframe carga
#  pero el SDK no puede hablar con el, y el ingreso falla con un
#  auth/internal-error que no dice nada. Paso en produccion el 2-sep-2026.
#  El de frame-src apunta al authDomain
#  (chus-fish.firebaseapp.com) y script-src con apis.google.com. Antes
#  frame-src estaba en 'none', que bloquea el iframe de Firebase Auth y
#  el ingreso con Google falla en silencio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googleapis.com https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://connect.facebook.net https://www.googletagmanager.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://firebasestorage.googleapis.com https://lh3.googleusercontent.com https://www.facebook.com; connect-src 'self' https://chus-fish.firebaseapp.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://accounts.google.com https://*.firebaseio.com wss://*.firebaseio.com https://firebasestorage.googleapis.com https://www.facebook.com https://api.cloudinary.com https://res.cloudinary.com https://www.gstatic.com https://connect.facebook.net https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; frame-src https://chus-fish.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self';"

# ── Redirect www → apex ─────────────────────────────
[[redirects]]
  from = "https://www.chusfish.com/*"
  to   = "https://chusfish.com/:splat"
  status = 301
  force  = true

# ── Cache: assets estáticos 1 año ───────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagenes y logos de la raiz. Sin esta regla caian bajo "/*.html"
# (max-age=0) y el navegador volvia a pedir el logo en cada pagina:
# se midieron 4 descargas del mismo logo en una sola visita a la portada.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
